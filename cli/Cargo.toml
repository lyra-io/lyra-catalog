[package]
name = "lyra-catalog-cli"
description = "Command line interface for the Lyra catalog."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "lyra-catalog"
path = "src/main.rs"

[dependencies]
lyra-catalog = { path = "../catalog" }
lyra-meta = { workspace = true }
clap = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
serde_yaml_ng = "=0.10.0"
url = "2"
zeroize = "1.8"
opentelemetry = { version = "0.32", default-features = false, features = ["metrics"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["metrics"] }
opentelemetry-prometheus = "=0.32.0"
prometheus = { version = "0.14", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
