# (*************************************************************************
#  LYRA CATALOG CONFIGURATION
#
#  [meta] points at the Oxia service holding cluster metadata.
#  [cata] configures the PostgreSQL wire protocol listener.
# *************************************************************************)

[meta]
service_address = "127.0.0.1:6648"
namespace = "default"

[cata]
host = "127.0.0.1"
port = 5432
max_connections = 0
bootstrap_user = "root"
# Development-only password; replace it before deployment.
bootstrap_password = "lyra"
