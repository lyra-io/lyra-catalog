[package]
name = "lyra-catalog"
description = "SQL parsing, planning and the PostgreSQL wire protocol front end for Lyra."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lyra-meta = { workspace = true }
async-trait = { workspace = true }
dashmap = { workspace = true }
datafusion = { workspace = true }
datafusion-pg-catalog = { workspace = true }
datafusion-postgres = { workspace = true }
futures-util = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
bytes = "1"
tracing = { workspace = true }
opentelemetry = { version = "0.31", default-features = false, features = ["metrics"] }
rsasl = { version = "=2.3.1", default-features = false, features = ["provider", "config_builder", "scram-sha-2"] }

[dev-dependencies]
tokio = { workspace = true }
tokio-postgres = { workspace = true }
